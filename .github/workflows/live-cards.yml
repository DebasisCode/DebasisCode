name: Live profile cards

# Rebuilds assets/live/*.svg (3D contribution calendar + competitive
# programming card) from GitHub, LeetCode and Codeforces once a day, and
# whenever the generator itself changes.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live/**'
      - '.github/workflows/live-cards.yml'

permissions:
  contents: write

concurrency:
  group: live-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build cards
        run: node scripts/live/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "Update live profile cards"
            git push
          fi
