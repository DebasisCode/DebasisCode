<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" width="1200" height="262" role="img" aria-label="Debasis Chattaraj - SDE Intern at SnowSEO, Full-Stack Developer, Competitive Programmer, LeetCode Knight">
  <title>Debasis Chattaraj</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c1a"/>
      <stop offset="55%" stop-color="#0d1228"/>
      <stop offset="100%" stop-color="#140f2e"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f472b6;#38bdf8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#38bdf8;#a78bfa" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#a78bfa;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#64748b" stroke-width="0.6" stroke-opacity="0.16"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="262" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="262" fill="url(#bg)"/>

    <!-- drifting aurora -->
    <g filter="url(#soften)" opacity="0.55">
      <circle cx="200" cy="80" r="118" fill="#0ea5e9">
        <animateTransform attributeName="transform" type="translate" values="0 0; 90 40; -40 20; 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="205" r="134" fill="#8b5cf6">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 -50; 60 -20; 0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="62" r="118" fill="#ec4899">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 60; 30 -30; 0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="262" fill="url(#grid)"/>

    <rect x="40" y="44" width="4" height="174" rx="2" fill="url(#rail)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- name: measured 507px wide at 60px/800 -->
    <text x="70" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="60" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.2">Debasis Chattaraj</text>
    <rect x="590" y="68" width="5" height="52" rx="2" fill="#f472b6">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="70" y="148" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500" fill="#94a3b8">Building clean, performant and creative software — end to end.</text>

    <!-- chips: widths derived from measured text (172 / 149 / 180 / 120) + padding -->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <g>
        <rect x="70" y="182" width="226" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.55"/>
        <circle cx="90" cy="199" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="104" y="204" fill="#7dd3fc">SDE Intern @ SnowSEO</text>
      </g>
      <g>
        <rect x="308" y="182" width="189" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.55"/>
        <text x="328" y="204" fill="#c4b5fd">Full-Stack Developer</text>
      </g>
      <g>
        <rect x="509" y="182" width="220" height="34" rx="17" fill="#ec4899" fill-opacity="0.13" stroke="#f472b6" stroke-opacity="0.55"/>
        <text x="529" y="204" fill="#f9a8d4">Competitive Programmer</text>
      </g>
      <g>
        <rect x="741" y="182" width="160" height="34" rx="17" fill="#f59e0b" fill-opacity="0.13" stroke="#fbbf24" stroke-opacity="0.55"/>
        <text x="761" y="204" fill="#fcd34d">LeetCode Knight</text>
      </g>
    </g>

    <!-- orbiting nodes -->
    <g transform="translate(1035 100)" opacity="0.9">
      <circle r="58" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1"/>
      <circle r="86" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="7" fill="#a78bfa" filter="url(#glow)"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/><circle cx="58" cy="0" r="4.5" fill="#38bdf8"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/><circle cx="86" cy="0" r="4" fill="#f472b6"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="140" to="500" dur="14s" repeatCount="indefinite"/><circle cx="86" cy="0" r="3" fill="#7dd3fc"/></g>
    </g>

    <rect x="0" y="248" width="1200" height="3" fill="#a78bfa" fill-opacity="0.14"/>
    <rect x="-400" y="248" width="400" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="-400;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="261" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.28"/>
</svg>
