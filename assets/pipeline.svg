<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Architecture diagram: REST API to queue to workers to AI and MCP layer to integrations to analytics, with a retry and backoff loop">
  <title>The systems I like building</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c1a"/>
      <stop offset="100%" stop-color="#120e28"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#64748b" fill-opacity="0.20"/>
    </pattern>
    <filter id="n-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#a78bfa" fill-opacity="0.85"/>
    </marker>
    <clipPath id="pframe"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#pframe)">
    <rect width="1200" height="300" fill="url(#panel)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <text x="26" y="44" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#e2e8f0">The systems I like building</text>
    <text x="26" y="70" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#64748b">queue-backed · idempotent · retry-aware · rate-limit budgeted · observable</text>

    <!-- flow rail + travelling packets (behind the nodes, so data "passes through") -->
    <path id="rail" d="M184,129 H1016" fill="none" stroke="url(#flow)" stroke-opacity="0.30" stroke-width="2"/>
    <g fill="#e0f2fe">
      <circle r="4.5" filter="url(#n-glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M184,129 H1016"/></circle>
      <circle r="4.5" filter="url(#n-glow)"><animateMotion dur="6s" begin="1.2s" repeatCount="indefinite" path="M184,129 H1016"/></circle>
      <circle r="4.5" filter="url(#n-glow)"><animateMotion dur="6s" begin="2.4s" repeatCount="indefinite" path="M184,129 H1016"/></circle>
      <circle r="4.5" filter="url(#n-glow)"><animateMotion dur="6s" begin="3.6s" repeatCount="indefinite" path="M184,129 H1016"/></circle>
      <circle r="4.5" filter="url(#n-glow)"><animateMotion dur="6s" begin="4.8s" repeatCount="indefinite" path="M184,129 H1016"/></circle>
    </g>
    <g stroke="none">
      <path d="M206,124 L216,129 L206,134 z" fill="#a78bfa" fill-opacity="0.7"/>
      <path d="M404,124 L414,129 L404,134 z" fill="#a78bfa" fill-opacity="0.7"/>
      <path d="M602,124 L612,129 L602,134 z" fill="#a78bfa" fill-opacity="0.7"/>
      <path d="M800,124 L810,129 L800,134 z" fill="#f472b6" fill-opacity="0.7"/>
      <path d="M998,124 L1008,129 L998,134 z" fill="#fbbf24" fill-opacity="0.7"/>
    </g>

    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">

      <!-- 1 REST API -->
      <g>
        <rect x="26" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="105" y="124" font-size="15" font-weight="700" fill="#e2e8f0">REST API</text>
        <text x="105" y="145" font-size="11" font-weight="500" fill="#7dd3fc">Fastify · typed</text>
      </g>

      <!-- 2 Queue -->
      <g>
        <rect x="224" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.6"/>
        <text x="303" y="124" font-size="15" font-weight="700" fill="#e2e8f0">Queue</text>
        <text x="303" y="145" font-size="11" font-weight="500" fill="#67e8f9">Redis · BullMQ</text>
      </g>

      <!-- 3 Workers -->
      <g>
        <rect x="422" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-opacity="0.6"/>
        <text x="501" y="122" font-size="15" font-weight="700" fill="#e2e8f0">Workers</text>
        <g fill="#a78bfa">
          <circle cx="481" cy="141" r="3.6"><animate attributeName="fill-opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
          <circle cx="495" cy="141" r="3.6"><animate attributeName="fill-opacity" values="1;0.2;1" dur="1.5s" begin="0.35s" repeatCount="indefinite"/></circle>
          <circle cx="509" cy="141" r="3.6"><animate attributeName="fill-opacity" values="1;0.2;1" dur="1.5s" begin="0.7s" repeatCount="indefinite"/></circle>
          <circle cx="523" cy="141" r="3.6"><animate attributeName="fill-opacity" values="1;0.2;1" dur="1.5s" begin="1.05s" repeatCount="indefinite"/></circle>
        </g>
      </g>

      <!-- 4 AI / MCP -->
      <g>
        <rect x="620" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#c084fc" stroke-opacity="0.6"/>
        <text x="699" y="124" font-size="15" font-weight="700" fill="#e2e8f0">AI · MCP</text>
        <text x="699" y="145" font-size="11" font-weight="500" fill="#d8b4fe">agents + tools</text>
      </g>

      <!-- 5 Integrations -->
      <g>
        <rect x="818" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#f472b6" stroke-opacity="0.6"/>
        <text x="897" y="124" font-size="15" font-weight="700" fill="#e2e8f0">Integrations</text>
        <text x="897" y="145" font-size="11" font-weight="500" fill="#f9a8d4">ATS · GSC · GA4</text>
      </g>

      <!-- 6 Analytics -->
      <g>
        <rect x="1016" y="96" width="158" height="66" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-opacity="0.6"/>
        <text x="1080" y="122" font-size="15" font-weight="700" fill="#e2e8f0">Analytics</text>
        <g fill="#fbbf24">
          <rect x="1036" y="136" width="7" height="12" rx="2"><animate attributeName="height" values="6;16;9;6" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="142;132;139;142" dur="3s" repeatCount="indefinite"/></rect>
          <rect x="1048" y="132" width="7" height="16" rx="2"><animate attributeName="height" values="16;8;18;16" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="132;140;130;132" dur="3s" repeatCount="indefinite"/></rect>
          <rect x="1060" y="138" width="7" height="10" rx="2"><animate attributeName="height" values="10;18;12;10" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="138;130;136;138" dur="3s" repeatCount="indefinite"/></rect>
          <rect x="1072" y="134" width="7" height="14" rx="2"><animate attributeName="height" values="14;7;17;14" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="134;141;131;134" dur="3s" repeatCount="indefinite"/></rect>
        </g>
        <text x="1130" y="145" font-size="11" font-weight="500" fill="#fcd34d">pipelines</text>
      </g>
    </g>

    <!-- retry / backoff loop: workers back to queue -->
    <path id="retry" d="M501,162 C501,214 303,214 303,162" fill="none" stroke="#f472b6" stroke-opacity="0.55"
          stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/>
    <circle r="3.8" fill="#f472b6" filter="url(#n-glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M501,162 C501,214 303,214 303,162"/>
    </circle>
    <text x="402" y="232" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="600" fill="#f9a8d4">retry + exponential backoff</text>

    <!-- dead-letter drop -->
    <path d="M699,162 L699,196" fill="none" stroke="#64748b" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
    <text x="699" y="216" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="600" fill="#94a3b8">dead-letter + replay</text>

    <!-- principles -->
    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <g><rect x="26" y="252" width="176" height="30" rx="15" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
         <text x="46" y="271" fill="#7dd3fc">design before endpoint</text></g>
      <g><rect x="214" y="252" width="166" height="30" rx="15" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.35"/>
         <text x="234" y="271" fill="#c4b5fd">own it end-to-end</text></g>
      <g><rect x="392" y="252" width="186" height="30" rx="15" fill="#f472b6" fill-opacity="0.10" stroke="#f472b6" stroke-opacity="0.35"/>
         <text x="412" y="271" fill="#f9a8d4">automate the repetition</text></g>
      <g><rect x="590" y="252" width="196" height="30" rx="15" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.35"/>
         <text x="610" y="271" fill="#fcd34d">measure, then optimise</text></g>
      <g><rect x="798" y="252" width="180" height="30" rx="15" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
         <text x="818" y="271" fill="#67e8f9">fix causes, not symptoms</text></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.28"/>
</svg>
